services:
  - type: web
    name: chingchanping
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: RENDER_DISK_PATH
        value: /var/data/chingchanping
